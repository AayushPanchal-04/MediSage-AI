services:
  - type: web
    name: mediai-backend
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: MONGODB_URI      # e.g. a MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
